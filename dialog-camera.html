<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Caméra TableIA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #f4f7fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .dialog-card {
            width: 100%;
            max-width: 520px;
            padding: 18px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        #message {
            min-height: 40px;
            margin: 0 0 12px;
            color: #4b5563;
            line-height: 1.35;
        }

        video {
            display: none;
            width: 100%;
            max-height: 48vh;
            margin: 0 0 12px;
            border-radius: 12px;
            background: #111827;
            object-fit: contain;
        }

        .actions {
            display: grid;
            gap: 10px;
        }

        button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 12px;
            background: #138a47;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
            opacity: 0.55;
        }

        .privacy {
            margin: 12px 0 0;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.35;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <main class="dialog-card">
        <h1>📷 Photo TableIA</h1>

        <p id="message">
            Activez la caméra, puis photographiez votre document.
        </p>

        <video
            id="cameraPreview"
            autoplay
            muted
            playsinline
        ></video>

        <canvas id="photoCanvas"></canvas>

        <div class="actions">
            <button id="startCameraButton" type="button">
                📷 ACTIVER LA CAMÉRA
            </button>

            <button id="takePhotoButton" type="button" disabled>
                ✅ PRENDRE LA PHOTO
            </button>
        </div>

        <p class="privacy">
            La photo est utilisée uniquement pour créer votre tableau.
        </p>
    </main>

    <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
    <script>
        const cameraPreview =
            document.getElementById("cameraPreview");

        const photoCanvas =
            document.getElementById("photoCanvas");

        const startCameraButton =
            document.getElementById("startCameraButton");

        const takePhotoButton =
            document.getElementById("takePhotoButton");

        const message =
            document.getElementById("message");

        const queryParameters =
            new URLSearchParams(window.location.search);

        const externalMode =
            queryParameters.get("external") === "1";

        const standaloneMode =
            queryParameters.has("standalone");

        const externalSessionId =
            queryParameters.get("session") || "";

        const PHOTO_BRIDGE_FUNCTION_URL =
            "https://ctihdqybwmymalpkjkov.supabase.co/functions/v1/tableia-photo-bridge";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_LU68bB5ip1OEPr8DJnjJJg_G36GmXoY";

        let cameraStream = null;
        let officeReady =
            externalMode || standaloneMode;

        function stopCamera() {
            if (!cameraStream) {
                return;
            }

            cameraStream.getTracks().forEach(
                function (track) {
                    track.stop();
                }
            );

            cameraStream = null;
        }

        function cameraErrorMessage(error) {
            const messages = {
                NotAllowedError:
                    "L'accès à la caméra a été refusé. Autorisez-le dans Safari puis réessayez.",
                NotFoundError:
                    "Aucune caméra n'a été détectée sur cet appareil.",
                NotReadableError:
                    "La caméra est déjà utilisée par une autre application.",
                OverconstrainedError:
                    "La caméra ne prend pas en charge les réglages demandés.",
                SecurityError:
                    "Le navigateur a bloqué l'accès sécurisé à la caméra."
            };

            return messages[error?.name] ||
                error?.message ||
                "Impossible d'activer la caméra.";
        }

        async function sendToTableIA(payload) {
            if (externalMode) {
                if (
                    !/^[a-f0-9]{64}$/.test(
                        externalSessionId
                    )
                ) {
                    throw new Error(
                        "La session photo n'est pas valide. Retournez dans Excel et recommencez."
                    );
                }

                const dataUrlParts =
                    String(payload.dataUrl || "")
                        .match(/^data:(image\/(?:jpeg|png|webp));base64,(.+)$/);

                if (!dataUrlParts) {
                    throw new Error(
                        "La photo préparée n'est pas valide."
                    );
                }

                const response =
                    await fetch(
                        PHOTO_BRIDGE_FUNCTION_URL,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                apikey:
                                    SUPABASE_PUBLISHABLE_KEY,
                                Authorization:
                                    `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
                            },
                            body: JSON.stringify({
                                action: "upload",
                                sessionId:
                                    externalSessionId,
                                imageMimeType:
                                    dataUrlParts[1],
                                imageBase64:
                                    dataUrlParts[2]
                            })
                        }
                    );

                let result = {};

                try {
                    result =
                        await response.json();
                } catch (_) {
                    result = {};
                }

                if (!response.ok) {
                    throw new Error(
                        result.error ||
                        "La photo n'a pas pu être transmise à Excel."
                    );
                }

                return;
            }

            if (
                typeof Office === "undefined" ||
                !Office.context ||
                !Office.context.ui ||
                typeof Office.context.ui.messageParent !== "function"
            ) {
                throw new Error(
                    "La communication avec Excel n'est pas disponible."
                );
            }

            Office.context.ui.messageParent(
                JSON.stringify(payload)
            );
        }

        function showError(error) {
            const errorText =
                cameraErrorMessage(error);

            message.textContent =
                "❌ " + errorText;

            startCameraButton.disabled =
                false;

            startCameraButton.textContent =
                "📷 RÉESSAYER";

            takePhotoButton.disabled =
                true;
        }

        if (
            !externalMode &&
            !standaloneMode &&
            typeof Office !== "undefined"
        ) {
            Office.onReady()
                .then(function () {
                    officeReady = true;
                })
                .catch(function () {
                    showError(
                        new Error(
                            "La fenêtre photo ne peut pas communiquer avec Excel."
                        )
                    );
                });
        }

        if (
            !navigator.mediaDevices ||
            typeof navigator.mediaDevices.getUserMedia !== "function"
        ) {
            startCameraButton.disabled =
                true;

            message.textContent =
                "❌ La caméra n'est pas disponible dans ce navigateur.";
        }

        if (
            externalMode &&
            !/^[a-f0-9]{64}$/.test(
                externalSessionId
            )
        ) {
            startCameraButton.disabled =
                true;

            message.textContent =
                "❌ Session photo invalide. Retournez dans Excel et appuyez de nouveau sur Prendre une photo.";
        }

        startCameraButton.addEventListener(
            "click",
            async function () {
                if (!officeReady) {
                    showError(
                        new Error(
                            "Excel termine l'ouverture de la fenêtre. Réessayez dans une seconde."
                        )
                    );
                    return;
                }

                startCameraButton.disabled =
                    true;

                startCameraButton.textContent =
                    "⏳ ACTIVATION...";

                message.textContent =
                    "Autorisez l'accès à la caméra si Safari le demande.";

                stopCamera();

                try {
                    cameraStream =
                        await navigator.mediaDevices.getUserMedia({
                            video: {}
                        });

                    cameraPreview.srcObject =
                        cameraStream;

                    cameraPreview.style.display =
                        "block";

                    await cameraPreview.play();

                    message.textContent =
                        "Cadrez le document puis prenez la photo.";

                    startCameraButton.textContent =
                        "📷 CAMÉRA ACTIVE";

                    takePhotoButton.disabled =
                        false;
                } catch (error) {
                    stopCamera();
                    showError(error);
                }
            }
        );

        takePhotoButton.addEventListener(
            "click",
            async function () {
                if (
                    !cameraStream ||
                    !cameraPreview.videoWidth ||
                    !cameraPreview.videoHeight
                ) {
                    showError(
                        new Error(
                            "La caméra n'est pas encore prête."
                        )
                    );
                    return;
                }

                takePhotoButton.disabled =
                    true;

                message.textContent =
                    "⏳ Préparation de la photo...";

                const maxSize =
                    1600;

                const ratio =
                    Math.min(
                        1,
                        maxSize / cameraPreview.videoWidth,
                        maxSize / cameraPreview.videoHeight
                    );

                photoCanvas.width =
                    Math.round(
                        cameraPreview.videoWidth * ratio
                    );

                photoCanvas.height =
                    Math.round(
                        cameraPreview.videoHeight * ratio
                    );

                const context =
                    photoCanvas.getContext("2d");

                context.drawImage(
                    cameraPreview,
                    0,
                    0,
                    photoCanvas.width,
                    photoCanvas.height
                );

                const dataUrl =
                    photoCanvas.toDataURL(
                        "image/jpeg",
                        0.82
                    );

                stopCamera();

                try {
                    await sendToTableIA({
                        type: "tableia-camera-photo",
                        dataUrl: dataUrl
                    });

                    message.textContent =
                        externalMode
                            ? "✅ Photo transmise à TableIA. Vous pouvez fermer cette page et revenir dans Excel."
                            : "✅ Photo prise en compte.";

                    if (externalMode) {
                        startCameraButton.style.display =
                            "none";

                        takePhotoButton.style.display =
                            "none";
                    }
                } catch (error) {
                    showError(error);
                }
            }
        );

        window.addEventListener(
            "beforeunload",
            stopCamera
        );
    </script>
</body>
</html>
