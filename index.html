<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TableIA Excel</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">

            <h1>TableIA</h1>

            <p>
                Transformez une photo brute
                en tableau Excel structuré.
            </p>

        </header>

<section class="card">

    <h2>
        ✍️ Créer par texte ou par voix
    </h2>

    <textarea
        id="textPrompt"
        rows="5"
        placeholder="Décrivez le tableau que vous souhaitez créer..."
    ></textarea>

    <button
        id="voiceButton"
        type="button"
    >
        🎙 DICTER MA DEMANDE
    </button>

    <button
        id="textAnalyzeButton"
        type="button"
    >
        ✨ CRÉER LE TABLEAU
    </button>

</section>
        
        <section class="card">

            <h2>
                📷 Importer un document
            </h2>

            <p class="description">
                Photographiez ou sélectionnez
                une feuille contenant vos données.
            </p>


            <label
    for="cameraInput"
    class="photo-button"
>
    📷 PRENDRE UNE PHOTO
</label>

<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
>


<label
    for="galleryInput"
    class="photo-button"
>
    🖼 CHOISIR DANS LA GALERIE
</label>

<input
    id="galleryInput"
    type="file"
    accept="image/*"
>


            <img
                id="photoPreview"
                class="photo-preview"
                alt="Aperçu du document"
            >


            <button
                id="analyzeButton"
                type="button"
                disabled
            >
                ✨ ANALYSER AVEC L'IA
            </button>


            <p
                id="status"
                class="status"
            ></p>

        </section>


        <section
            id="resultSection"
            class="card result-section"
        >

            <h2>
                Tableau détecté
            </h2>

            <div
                id="tableContainer"
                class="table-container"
            ></div>

    <button
    id="modifyTableButton"
    type="button"
>
    ✨ MODIFIER LE TABLEAU AVEC L'IA
</button>

<button
    id="deleteTableButton"
    type="button"
>
    🗑 SUPPRIMER LE TABLEAU
</button>

<button
    id="insertExcelButton"
    type="button"
    disabled
>
    📊 INSÉRER DANS EXCEL
</button>

        </section>

    </main>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="app.js"></script>

</body>
  </html>
