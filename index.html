<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TableIA Excel</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">

            <h1>TableIA</h1>

            <p>
                Transformez une photo brute
                en tableau Excel structuré.
            </p>

<section class="card">

    <h2>
        ✨ Créer ou modifier un tableau
    </h2>

    <textarea
        id="textPrompt"
        rows="5"
        placeholder="Écrivez ou dictez votre demande..."
    ></textarea>


    <label
        for="cameraInput"
        class="photo-button"
    >
        📷 PRENDRE UNE PHOTO
    </label>

    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
    >


    <label
        for="galleryInput"
        class="photo-button"
    >
        🖼 CHOISIR DANS LA GALERIE
    </label>

    <input
        id="galleryInput"
        type="file"
        accept="image/*"
    >


    <img
        id="photoPreview"
        class="photo-preview"
        alt="Aperçu du document"
    >


    <button
        id="voiceButton"
        type="button"
    >
        🎙 DICTER MA DEMANDE
    </button>


    <button
        id="textAnalyzeButton"
        type="button"
    >
        ✨ CRÉER LE TABLEAU
    </button>


    <button
        id="clearPromptButton"
        type="button"
    >
        🧹 EFFACER LA DEMANDE
    </button>

    <p
        id="status"
        class="status"
    ></p>

        </section>

        <section
            id="resultSection"
            class="card result-section"
        >

            <h2>
                Tableau détecté
            </h2>

            <div
                id="tableContainer"
                class="table-container"
            ></div>

<button
    id="undoTableButton"
    type="button"
>
    ↩ ANNULER LA DERNIÈRE MODIFICATION
</button>
            
<button
    id="deleteTableButton"
    type="button"
>
    🗑 SUPPRIMER LE TABLEAU
</button>

<button
    id="insertExcelButton"
    type="button"
    disabled
>
    📊 INSÉRER DANS EXCEL
</button>

        </section>

    </main>

<script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
<script src="app.js?v=20260918-5"></script>
</body>
  </html>
